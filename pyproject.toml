[build-system]
requires = [
  "numpy>=2.0",
  "pybind11>=3.0.2",
  "scikit-build-core>=0.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "pygpg"
version = "0.3.0"
description = "GP-GOMEA symbolic regression with a scikit-learn-compatible Python interface and C++ backend."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Marco Virgolin" },
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.7,<2.0",
  "sympy>=1.13",
  "sympytorch>=0.1.4",
  "torch>=2.11",
]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"

[tool.uv]
package = true